[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-research-assistant"
version = "0.1.0"
description = "Multi-Agent Research Assistant Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "langgraph",
    "langchain",
    "langchain-groq",
    "langchain-openai",
    "tavily-python"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

