<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Multi-Agent Research Assistant logo (dark theme)</title>
  <desc>An abstract network of connected nodes in white/light gray, representing orchestrated AI agents, with one central node highlighted in indigo, designed for use on dark backgrounds.</desc>

  <!-- connecting lines: outer nodes to center -->
  <line x1="100" y1="100" x2="52" y2="52" stroke="#E5E5E5" stroke-width="2"/>
  <line x1="100" y1="100" x2="148" y2="52" stroke="#E5E5E5" stroke-width="2"/>
  <line x1="100" y1="100" x2="52" y2="148" stroke="#E5E5E5" stroke-width="2"/>
  <line x1="100" y1="100" x2="148" y2="148" stroke="#E5E5E5" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="34" stroke="#E5E5E5" stroke-width="2"/>

  <!-- outer agent nodes (dark fill, light outline) -->
  <circle cx="52" cy="52" r="15" fill="#111111" stroke="#E5E5E5" stroke-width="3"/>
  <circle cx="148" cy="52" r="15" fill="#111111" stroke="#E5E5E5" stroke-width="3"/>
  <circle cx="52" cy="148" r="15" fill="#111111" stroke="#E5E5E5" stroke-width="3"/>
  <circle cx="148" cy="148" r="15" fill="#111111" stroke="#E5E5E5" stroke-width="3"/>
  <circle cx="100" cy="34" r="12" fill="#111111" stroke="#E5E5E5" stroke-width="3"/>

  <!-- center orchestrator node: indigo accent -->
  <circle cx="100" cy="100" r="24" fill="#E5E5E5"/>
  <circle cx="100" cy="100" r="24" fill="none" stroke="#6C63FF" stroke-width="3"/>
  <circle cx="100" cy="100" r="8" fill="#6C63FF"/>
</svg>
